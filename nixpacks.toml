# Nixpacks configuration for Railway
# This installs Stockfish chess engine

[phases.setup]
nixPkgs = ["stockfish", "python311", "python311Packages.pip"]

[phases.install]
cmds = ["python3.11 -m pip install -r requirements.txt"]

[start]
cmd = "python3.11 -m gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app"
