services:
  - type: web
    name: aigambit
    env: python
    buildCommand: apt-get update && apt-get install -y stockfish && pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
