services:
  - type: web
    name: aigambit
    env: python
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y stockfish || true
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
